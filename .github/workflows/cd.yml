name: Server CD Pipeline

on:
  push:
    branches: [main, dev]

jobs:
  ci:
    name: Server CI
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: package-lock.json

      - name: Install Dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

  build-and-push:
    name: Build & Push Docker Image
    runs-on: ubuntu-latest
    needs: ci
    outputs:
      image_tag: ${{ steps.meta.outputs.tags }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract Docker Metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.DOCKERHUB_USERNAME }}/dishcovery-server
          tags: |
            type=raw,value=latest
            type=sha,prefix=sha-

      - name: Build & Push Image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to EC2
    runs-on: ubuntu-latest
    needs: build-and-push
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            # Install Docker and Docker Compose if not present
            if ! command -v docker &> /dev/null || ! docker compose version &> /dev/null; then
              echo "Installing Docker and Docker Compose..."
              sudo apt-get update -y
              sudo apt-get install -y ca-certificates curl gnupg
              sudo install -m 0755 -d /etc/apt/keyrings
              curl -fsSL https://download.docker.com/linux/ubuntu/gpg | sudo gpg --dearmor -o /etc/apt/keyrings/docker.gpg --yes
              sudo chmod a+r /etc/apt/keyrings/docker.gpg

              echo \
                "deb [arch="$(dpkg --print-architecture)" signed-by=/etc/apt/keyrings/docker.gpg] https://download.docker.com/linux/ubuntu \
                "$(. /etc/os-release && echo "$VERSION_CODENAME")" stable" | \
                sudo tee /etc/apt/sources.list.d/docker.list > /dev/null
              
              sudo apt-get update -y
              sudo apt-get install -y docker-ce docker-ce-cli containerd.io docker-buildx-plugin docker-compose-plugin
              
              sudo usermod -aG docker $USER
            fi

            # Create app directory
            mkdir -p /home/ubuntu/dishcovery-server

            # Write docker-compose.yml (always overwrite with latest)
            cat > /home/ubuntu/dishcovery-server/docker-compose.yml << 'EOF'
            services:
              server:
                image: ${{ secrets.DOCKERHUB_USERNAME }}/dishcovery-server:latest
                ports:
                  - "4001:4000"
                depends_on:
                  - mongodb
                  - redis
                env_file:
                  - .env
                environment:
                  - MONGO_URI=mongodb://mongodb:27017/dishcovery
                  - REDIS_URL=redis://redis:6379
                  - NODE_ENV=production
                restart: always
                networks:
                  - dishcovery-network

              mongodb:
                image: mongo:latest
                ports:
                  - "27018:27017"
                volumes:
                  - mongodb_data:/data/db
                restart: always
                networks:
                  - dishcovery-network

              redis:
                image: redis:alpine
                ports:
                  - "6380:6379"
                volumes:
                  - redis_data:/data
                restart: always
                networks:
                  - dishcovery-network

            volumes:
              mongodb_data:
              redis_data:

            networks:
              dishcovery-network:
                name: dishcovery-network
                driver: bridge
            EOF

            cd /home/ubuntu/dishcovery-server

            # Pull latest image and restart
            docker compose pull server
            docker compose up -d --remove-orphans

            # Clean up old unused images
            docker image prune -f

            echo "✅ Deployment complete!"
            docker compose ps
