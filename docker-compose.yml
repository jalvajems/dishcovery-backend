
services:
  server:
    # Image built & pushed by CD pipeline - pulled from Docker Hub on deploy
    image: ${DOCKERHUB_USERNAME}/dishcovery-server:latest
    ports:
      - "4001:4000"
    depends_on:
      - mongodb
      - redis
    env_file:
      - .env
    environment:
      - REDIS_URL=redis://redis:6379
      - TZ=Asia/Kolkata
      - NODE_ENV=production
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
    restart: always
    networks:
      - dishcovery-network

  mongodb:
    image: mongo:latest
    ports:
      - "27018:27017"
    volumes:
      - mongodb_data:/data/db
    restart: always
    networks:
      - dishcovery-network

  redis:
    image: redis:alpine
    ports:
      - "6380:6379"
    volumes:
      - redis_data:/data
    restart: always
    networks:
      - dishcovery-network

  vault:
    image: hashicorp/vault:latest
    container_name: dishcovery-vault
    ports:
      - "8200:8200"
    environment:
      - VAULT_KMS_TYPE=none
    volumes:
      - vault_data:/vault/file
      - ./vault/config:/vault/local-config
    command: server -config=/vault/local-config/vault.hcl
    cap_add:
      - IPC_LOCK
    restart: always
    networks:
      - dishcovery-network

volumes:
  mongodb_data:
  redis_data:
  vault_data:

networks:
  dishcovery-network:
    name: dishcovery-network
    driver: bridge
