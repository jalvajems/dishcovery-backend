services:
  server:
    # Image built & pushed by CD pipeline - pulled from Docker Hub on deploy
    image: ${DOCKERHUB_USERNAME}/dishcovery-server:latest
    ports:
      - "4001:4000"
    depends_on:
      - redis
    env_file:
      - .env
    environment:
      - REDIS_URL=redis://redis:6379
      - TZ=Asia/Kolkata
      - NODE_ENV=production
      - NODE_OPTIONS=--max-old-space-size=384
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
    restart: always
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "3"
    networks:
      - dishcovery-network

  redis:
    image: redis:alpine
    ports:
      - "6380:6379"
    volumes:
      - redis_data:/data
    restart: always
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - dishcovery-network

volumes:
  redis_data:

networks:
  dishcovery-network:
    name: dishcovery-network
    driver: bridge
